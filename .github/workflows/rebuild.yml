name: Rebuild CI

# The rebuild branch has its own pipeline while master keeps its existing one.
# Each section of the new build must be independently verifiable, so the gates
# are ordered cheapest-first: a broken type never waits on a browser to find out.
on:
  push:
    branches: [rebuild]
  pull_request:
    branches: [rebuild]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static:
    name: Types and lint gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npx nuxi typecheck
        env:
          VERCEL: '1'

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest

    # A real database, not a mock: the behaviour under test is row locking,
    # constraint enforcement and how concurrent transactions settle a race.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitesse
          POSTGRES_PASSWORD: vitesse
          POSTGRES_DB: vitesse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitesse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run integration suite
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://vitesse:vitesse@localhost:5432/vitesse_test

      # A suite that silently skips is worse than no suite: it reports green
      # while proving nothing. This fails the job if the database was missing.
      - name: Assert the suite actually ran
        run: |
          if npm run test:integration 2>&1 | grep -q "no tests"; then
            echo "Integration suite reported no tests — the database was not reachable."
            exit 1
          fi
        env:
          TEST_DATABASE_URL: postgres://vitesse:vitesse@localhost:5432/vitesse_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx nuxi build
        env:
          VERCEL: '1'
      - run: node scripts/check-bundle-size.mjs
        env:
          BUNDLE_BUDGET_BYTES: '6815744'
