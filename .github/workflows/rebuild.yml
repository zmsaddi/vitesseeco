name: Rebuild CI

# The rebuild branch has its own pipeline while master keeps its existing one.
# Each section of the new build must be independently verifiable, so the gates
# are ordered cheapest-first: a broken type never waits on a browser to find out.
on:
  push:
    branches: [rebuild]
  pull_request:
    branches: [rebuild]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static:
    name: Types and lint gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # Six locale files that drift are six pages that render a key instead of a
      # sentence. Enforced here rather than remembered before each commit.
      - name: Locale key parity
        run: npm run check:langs
      - name: No raw hex colours in templates
        run: npm run check:hex
      # Reports which Merchant feeds are safe to register. Skips silently
      # without a token so a fork or a secretless run is not blocked.
      # Each rule here encodes a defect that actually shipped and that the type
      # checker, the tests and the build all passed over.
      - name: Invariants
        run: npm run check:invariants
      - name: Merchant feed guard
        run: npm run check:feeds
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      - name: Type check
        run: npx nuxi typecheck
        env:
          VERCEL: '1'

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest

    # A real database, not a mock: the behaviour under test is row locking,
    # constraint enforcement and how concurrent transactions settle a race.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitesse
          POSTGRES_PASSWORD: vitesse
          POSTGRES_DB: vitesse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitesse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run integration suite
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://vitesse:vitesse@localhost:5432/vitesse_test

      # A suite that silently skips is worse than no suite: it reports green
      # while proving nothing. This fails the job if the database was missing.
      - name: Assert the suite actually ran
        run: |
          if npm run test:integration 2>&1 | grep -q "no tests"; then
            echo "Integration suite reported no tests — the database was not reachable."
            exit 1
          fi
        env:
          TEST_DATABASE_URL: postgres://vitesse:vitesse@localhost:5432/vitesse_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx nuxi build
        env:
          VERCEL: '1'
      - run: node scripts/check-bundle-size.mjs
        env:
          BUNDLE_BUDGET_BYTES: '6815744'

  # The simulator is the gate that catches what the others cannot: a page that
  # renders a raw translation key, a hydration mismatch, a route that 500s, a
  # price that changes between two screens. Every one of those shipped green
  # through typecheck, unit tests and a build.
  simulate:
    name: Simulated customer journey
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Install a browser
        run: npx playwright install chromium --with-deps
      - name: Build for production
        run: npx nuxi build
        env:
          VERCEL: '1'
          NITRO_PRESET: node-server
      - name: Start the server
        run: node .output/server/index.mjs &
        env:
          VERCEL: '1'
          # No catalogue in CI: the simulator detects that and reports
          # catalogue-dependent findings as information rather than failing.
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN || 'ci-no-catalogue' }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          DATABASE_URL: postgres://ci:ci@localhost:5432/none
          AUTH_SECRET: ci-secret-not-used-for-anything-real
          PORT: '3000'
      - name: Wait for it
        run: npx wait-on http://127.0.0.1:3000/cgv --timeout 90000
      - name: Walk the site as a customer
        run: node tests/e2e/simulate.mjs http://127.0.0.1:3000 --locales fr,nl,de,es,en,ar
