name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pinning the action runners to Node 24 silences the upcoming Node-20 deprecation
# warning ahead of the 2026-06-02 enforcement date and matches the project's
# local Node version (24.14.1, see CLAUDE.md).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: npm run check:langs

      - name: Check raw hex colors
        run: npm run check:hex

      - name: Type check
        run: npx nuxi typecheck
        env:
          VERCEL: '1'

      - name: Build
        run: npx nuxi build
        env:
          VERCEL: '1'

      # P5-04 — bundle size budget
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs
        env:
          BUNDLE_BUDGET_BYTES: '13631488' # 13 MB gzip total

  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          TEST_BASE_URL: https://vitesseeco.vercel.app

  lighthouse:
    runs-on: ubuntu-latest
    # Only run on push to master (not every PR — saves CI minutes per ADR free-tier strategy)
    if: github.event_name == 'push'
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse against production
        run: |
          lhci autorun \
            --collect.url=https://vitesseeco.vercel.app/ \
            --collect.url=https://vitesseeco.vercel.app/produits \
            --collect.numberOfRuns=2 \
            --upload.target=temporary-public-storage \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance.minScore=0.85 \
            --assert.assertions.categories:accessibility.minScore=0.9 \
            --assert.assertions.categories:seo.minScore=0.9 \
            --assert.assertions.categories:best-practices.minScore=0.9
        continue-on-error: true # don't block the pipeline while we tune; flip to false when stable
